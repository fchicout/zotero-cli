name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Build and smoke-test every artifact (binaries, .deb/.rpm, MSI) on PRs
  # that change the release pipeline, so a mistake surfaces before a tag.
  # Nothing is published from a pull request.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/windows/**'
      - 'pyproject.toml'
      - 'uv.lock'

# Least privilege (release-pipeline advisory, audit #328): every job can
# only read, except `release`, which needs to write the GitHub release.
permissions:
  contents: read

# Supply-chain notes for this file:
# - Actions are pinned to full commit SHAs (the tag is in the comment);
#   Dependabot proposes updates.
# - Checkouts don't persist the token, and no job restores a cache that
#   other workflows (which run every dev dependency) could have written.
# - Dependencies, including PyInstaller, come from uv.lock.
# - Values from the event (tag names) reach scripts through `env:`, never
#   by interpolating ${{ }} into the script text.

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag points at a commit on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to release it."
            exit 1
          fi

      # Before anything is built or published (Issue #416): a mistyped tag
      # used to create a public GitHub release, and only the PyPI job
      # noticed. The package version is in two files; they must agree too.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pyproject="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package="$(python3 -c 'import re; print(re.search(r"^VERSION = \"(.+)\"", open("src/zotero_cli/__init__.py").read(), re.M).group(1))')"
          if [ "$pyproject" != "$package" ]; then
            echo "::error::pyproject.toml says $pyproject but zotero_cli.VERSION says $package."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$pyproject" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the package version $pyproject."
            exit 1
          fi
          # The release notes are the CHANGELOG section of this version.
          python3 scripts/release_notes.py "$pyproject" > /dev/null

  build-linux:
    needs: verify-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false

      - name: Install dependencies
        run: |
          # Exactly what uv.lock pins (Issue #333), plus the locked `release`
          # group (PyInstaller).
          uv sync --locked --no-editable --group release
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # --onedir (Issue #434 step 2): the installed packages below (.deb,
      # .rpm, .tar.gz) unpack once at install time instead of on every run.
      # --strip: an unstripped libpython3.14 is 34 MB instead of 22.7 MB,
      # all of it extracted from a onefile binary on every run - still worth
      # it here since it also shrinks what onedir installs to disk.
      - name: Build onedir binary with PyInstaller
        run: |
          pyinstaller --onedir --strip --name zotero-cli \
            --add-data "src/zotero_cli/templates/extraction_schema.yaml:zotero_cli/templates" \
            --add-data "src/zotero_cli/templates/demo_sandbox.yaml:zotero_cli/templates" \
            --exclude-module torch \
            --exclude-module nvidia \
            --exclude-module mkl \
            --exclude-module numpy \
            --exclude-module pandas \
            --exclude-module matplotlib \
            --exclude-module readline \
            --clean src/zotero_cli/cli/main.py

      # Never publish a binary that can't start (Issue #333).
      - name: Smoke test onedir binary
        run: |
          ./dist/zotero-cli/zotero-cli --help
          # Exercise bundled libraries, not just startup (Issue #403).
          ./dist/zotero-cli/zotero-cli system selftest

      # Real CLI commands against a fixture library, not just library-level
      # calls (Issue #399): catches a regression in the offline read path
      # (#363, #366) that --help/selftest alone would miss.
      - name: Smoke test onedir binary against a fixture library
        run: |
          python3 scripts/build_smoke_fixture.py smoke-fixture
          export ZOTERO_DATABASE_PATH="$PWD/smoke-fixture/zotero.sqlite"
          ./dist/zotero-cli/zotero-cli --offline item list --collection "Smoke Test" --format json \
            | grep -q "A Paper With a PDF"
          ./dist/zotero-cli/zotero-cli --offline search Lovelace | grep -q "A Paper With a PDF"
          ./dist/zotero-cli/zotero-cli --offline item inspect --key SMOKE001 | grep -q "SMOKEPDF"

      # Issue #434: "keep the bare onefile download for people who want one
      # file" - built separately (own --distpath/--workpath so it doesn't
      # clobber the onedir build above) and published alongside it, not
      # instead of it. Same module set, so a light smoke test is enough;
      # the onedir build above already exercised the fixture commands.
      - name: Build bare onefile binary with PyInstaller
        run: |
          pyinstaller --onefile --strip --name zotero-cli \
            --distpath dist-onefile --workpath build-onefile \
            --add-data "src/zotero_cli/templates/extraction_schema.yaml:zotero_cli/templates" \
            --add-data "src/zotero_cli/templates/demo_sandbox.yaml:zotero_cli/templates" \
            --exclude-module torch \
            --exclude-module nvidia \
            --exclude-module mkl \
            --exclude-module numpy \
            --exclude-module pandas \
            --exclude-module matplotlib \
            --exclude-module readline \
            --clean src/zotero_cli/cli/main.py

      - name: Smoke test bare onefile binary
        run: |
          ./dist-onefile/zotero-cli --help
          ./dist-onefile/zotero-cli system selftest

      # Notices for exactly what PyInstaller bundled (Issue #405); fails if a
      # bundled file can't be attributed to a licence. Built from the onedir
      # analysis; the onefile build above shares the same module set.
      - name: Generate licence notices
        run: |
          python scripts/gen_third_party_notices.py --build-dir build/zotero-cli \
            --output dist/THIRD_PARTY_LICENSES.txt
          cp LICENSE dist/LICENSE
          cp dist/THIRD_PARTY_LICENSES.txt THIRD_PARTY_LICENSES-linux.txt

      - name: Install FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm -v 1.18.0

      - name: Get Version
        id: get_version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Create Tarball
        run: |
          tar -czvf zotero-cli-linux-amd64.tar.gz -C dist zotero-cli LICENSE THIRD_PARTY_LICENSES.txt

      # Issue #434 step 2: installs the onedir tree under /usr/lib/zotero-cli
      # with a /usr/bin/zotero-cli symlink into it, the standard layout for a
      # multi-file Linux program - rather than /usr/bin holding the whole
      # tree, which would collide with every other package's files there.
      - name: Create DEB Package
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p dist/deb/usr/lib/zotero-cli dist/deb/usr/bin dist/deb/usr/share/doc/zotero-cli
          cp -r dist/zotero-cli/. dist/deb/usr/lib/zotero-cli/
          ln -s /usr/lib/zotero-cli/zotero-cli dist/deb/usr/bin/zotero-cli
          # /usr/share/doc/<package>/copyright is where Debian policy expects it.
          cp LICENSE dist/deb/usr/share/doc/zotero-cli/copyright
          cp dist/THIRD_PARTY_LICENSES.txt dist/deb/usr/share/doc/zotero-cli/
          fpm -s dir -t deb -n zotero-cli -v "$VERSION" \
            --prefix / \
            -C dist/deb \
            --description "Command-line interface for managing Zotero libraries" \
            --maintainer "Fabio Chicout <fchicout@gmail.com>" \
            --vendor "Fábio Chicout" \
            --license MIT \
            --url "https://github.com/fchicout/zotero-cli" \
            usr/bin/zotero-cli usr/lib/zotero-cli usr/share/doc/zotero-cli
          mv zotero-cli_*.deb zotero-cli-linux-amd64.deb

      - name: Create RPM Package
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          fpm -s dir -t rpm -n zotero-cli -v "$VERSION" \
            --prefix / \
            -C dist/deb \
            --description "Command-line interface for managing Zotero libraries" \
            --maintainer "Fabio Chicout <fchicout@gmail.com>" \
            --vendor "Fábio Chicout" \
            --license MIT \
            --url "https://github.com/fchicout/zotero-cli" \
            usr/bin/zotero-cli usr/lib/zotero-cli usr/share/doc/zotero-cli
          mv zotero-cli-*.rpm zotero-cli-linux-amd64.rpm

      # Issue #434: install, run and remove each package inside a clean
      # container - catches a broken symlink or a file-list mistake that
      # `fpm` itself won't; check-glibc-floor separately runs the raw
      # onedir binary across the supported-distro matrix.
      - name: Smoke test DEB and RPM install/uninstall
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work ubuntu:22.04 bash -euc '
            dpkg -i zotero-cli-linux-amd64.deb
            test -L /usr/bin/zotero-cli
            test -x /usr/lib/zotero-cli/zotero-cli
            dpkg -r zotero-cli
            test ! -e /usr/bin/zotero-cli
            test ! -d /usr/lib/zotero-cli
          '
          docker run --rm -v "$PWD:/work:ro" -w /work fedora:36 bash -euc '
            rpm -i zotero-cli-linux-amd64.rpm
            test -L /usr/bin/zotero-cli
            test -x /usr/lib/zotero-cli/zotero-cli
            rpm -e zotero-cli
            test ! -e /usr/bin/zotero-cli
            test ! -d /usr/lib/zotero-cli
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-artifacts
          path: |
            dist/zotero-cli
            dist-onefile/zotero-cli
            THIRD_PARTY_LICENSES-linux.txt
            zotero-cli-linux-amd64.tar.gz
            zotero-cli-linux-amd64.deb
            zotero-cli-linux-amd64.rpm

  # Verifies the documented glibc floor (Issue #413) against the distros the
  # README names as supported, on every run (a tag or a PR touching this
  # pipeline), rather than trusting an unverified claim. --help alone doesn't
  # reach the lowest floor: PDF text extraction pulls in `cryptography`'s
  # Rust extension, which needs a newer glibc than everything else in the
  # binary - checked with `system selftest` and the #399 fixture commands.
  # Runs the target distros as containers from the host runner (not
  # `jobs.<id>.container`), so it doesn't depend on git/python3 already
  # being in a minimal base image.
  check-glibc-floor:
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:9      # RHEL 9-compatible, glibc 2.34: the floor
          - ubuntu:22.04
          - debian:12
          - fedora:36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-artifacts
          path: bin

      - name: Build the fixture library
        run: python3 scripts/build_smoke_fixture.py smoke-fixture

      # Issue #434: the onedir tree (bin/dist/zotero-cli/) is mounted as a
      # directory rather than a single file, matching what the .deb/.rpm/
      # .tar.gz installers actually lay down; the bare onefile binary
      # (bin/dist-onefile/zotero-cli) is checked too since it's a separately
      # downloadable asset with its own glibc floor.
      - name: Run the binary in ${{ matrix.image }}
        run: |
          chmod +x bin/dist/zotero-cli/zotero-cli bin/dist-onefile/zotero-cli
          docker run --rm \
            -v "$PWD/bin/dist/zotero-cli:/opt/zotero-cli:ro" \
            -v "$PWD/bin/dist-onefile/zotero-cli:/zotero-cli-onefile:ro" \
            -v "$PWD/smoke-fixture:/fixture:ro" \
            -e ZOTERO_DATABASE_PATH=/fixture/zotero.sqlite \
            "${{ matrix.image }}" sh -euc '
              for z in /opt/zotero-cli/zotero-cli /zotero-cli-onefile; do
                "$z" --help >/dev/null
                "$z" system selftest
                "$z" --offline item list --collection "Smoke Test" --format json | grep -q "A Paper With a PDF"
                "$z" --offline search Lovelace | grep -q "A Paper With a PDF"
                "$z" --offline item inspect --key SMOKE001 | grep -q "SMOKEPDF"
              done
            '

  build-windows:
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false

      - name: Install dependencies
        run: |
          # Exactly what uv.lock pins (Issue #333), plus the locked `release`
          # group (PyInstaller).
          uv sync --locked --no-editable --group release
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.venv\Scripts"

      # --onedir (Issue #434 step 2): the ZIP and MSI below install the
      # unpacked tree instead of a self-extracting exe. No --strip: unlike
      # objcopy on Linux, PyInstaller's Windows strip needs a separate
      # toolchain this runner doesn't have, and wasn't used before either.
      - name: Build onedir binary with PyInstaller
        run: |
          pyinstaller --onedir --name zotero-cli `
            --add-data "src/zotero_cli/templates/extraction_schema.yaml;zotero_cli/templates" `
            --add-data "src/zotero_cli/templates/demo_sandbox.yaml;zotero_cli/templates" `
            --exclude-module torch `
            --exclude-module nvidia `
            --exclude-module mkl `
            --exclude-module numpy `
            --exclude-module pandas `
            --exclude-module matplotlib `
            --exclude-module readline `
            --clean src/zotero_cli/cli/main.py

      - name: Smoke test onedir binary
        run: |
          ./dist/zotero-cli/zotero-cli.exe --help
          ./dist/zotero-cli/zotero-cli.exe system selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # See the Linux job's equivalent step (Issue #399).
      - name: Smoke test onedir binary against a fixture library
        run: |
          python scripts/build_smoke_fixture.py smoke-fixture
          $env:ZOTERO_DATABASE_PATH = "$PWD\smoke-fixture\zotero.sqlite"
          $out = ./dist/zotero-cli/zotero-cli.exe --offline item list --collection "Smoke Test" --format json
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "A Paper With a PDF")) { throw "offline item list failed" }
          $out = ./dist/zotero-cli/zotero-cli.exe --offline search Lovelace
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "A Paper With a PDF")) { throw "offline search failed" }
          $out = ./dist/zotero-cli/zotero-cli.exe --offline item inspect --key SMOKE001
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "SMOKEPDF")) { throw "offline item inspect failed" }

      # Issue #434: "keep the bare onefile download for people who want one
      # file" - built separately so it doesn't clobber the onedir build
      # above; a light smoke test is enough since it shares the same module
      # set the onedir build already exercised against the fixture.
      - name: Build bare onefile binary with PyInstaller
        run: |
          pyinstaller --onefile --name zotero-cli `
            --distpath dist-onefile --workpath build-onefile `
            --add-data "src/zotero_cli/templates/extraction_schema.yaml;zotero_cli/templates" `
            --add-data "src/zotero_cli/templates/demo_sandbox.yaml;zotero_cli/templates" `
            --exclude-module torch `
            --exclude-module nvidia `
            --exclude-module mkl `
            --exclude-module numpy `
            --exclude-module pandas `
            --exclude-module matplotlib `
            --exclude-module readline `
            --clean src/zotero_cli/cli/main.py

      - name: Smoke test bare onefile binary
        run: |
          ./dist-onefile/zotero-cli.exe --help
          ./dist-onefile/zotero-cli.exe system selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate licence notices
        shell: pwsh
        run: |
          python scripts/gen_third_party_notices.py --build-dir build/zotero-cli `
            --output dist/THIRD_PARTY_LICENSES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item dist/THIRD_PARTY_LICENSES.txt THIRD_PARTY_LICENSES-windows.txt

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          $numericVersion = $version -replace '-.*$', ''
          if ($numericVersion -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            # 0.0.0 used to be used silently, which breaks MSI upgrades (Issue #416).
            Write-Output "::error::Version '$version' can't be mapped to an MSI version (x.y.z)."
            exit 1
          }
          echo "VERSION=$numericVersion" >> $env:GITHUB_OUTPUT

      # WiX 5 (Issue #434): 4.0.1's authoring had no way to bulk-include a
      # directory tree, only single <File> elements - fine for one exe, not
      # for onedir's exe-plus-dozens-of-support-files tree. WiX 5's <Files
      # Include="..."> element harvests it instead of hand-listing every
      # file, which would silently go stale as dependencies change.
      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI Installer
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          wix build -d Version=$env:VERSION scripts/windows/installer.wxs -o zotero-cli-windows-amd64.msi

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/zotero-cli, dist/LICENSE.txt, dist/THIRD_PARTY_LICENSES.txt `
            -DestinationPath zotero-cli-windows-amd64.zip

      # Issue #434: install and uninstall the MSI in a throwaway user
      # profile, catching a harvesting/component mistake that a successful
      # `wix build` wouldn't (a missing file, a broken PATH entry, files left
      # behind after uninstall). Full multi-version upgrade sequencing isn't
      # covered here - it would need a previous release's MSI on hand - but
      # `MajorUpgrade` above is what makes that path work.
      - name: Smoke test MSI install/uninstall
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\zotero-cli"
          msiexec /i zotero-cli-windows-amd64.msi /quiet /qn /norestart
          if ($LASTEXITCODE -ne 0) { throw "MSI install failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$installDir\zotero-cli.exe")) { throw "zotero-cli.exe missing after install" }
          & "$installDir\zotero-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "installed exe failed to run" }
          msiexec /x zotero-cli-windows-amd64.msi /quiet /qn /norestart
          if ($LASTEXITCODE -ne 0) { throw "MSI uninstall failed with exit code $LASTEXITCODE" }
          if (Test-Path "$installDir\zotero-cli.exe") { throw "zotero-cli.exe still present after uninstall" }

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-artifacts
          path: |
            dist/zotero-cli
            dist-onefile/zotero-cli.exe
            THIRD_PARTY_LICENSES-windows.txt
            zotero-cli-windows-amd64.zip
            zotero-cli-windows-amd64.msi

  release:
    # After PyPI (Issue #416): `install.sh` "latest" follows this release, so
    # it must not appear before the package it matches.
    if: github.event_name == 'push'
    needs: [build-linux, build-windows, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its files
      id-token: write  # sign the build provenance attestation
      attestations: write
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-artifacts
          path: assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-artifacts
          path: assets

      # Issue #434: the bare single-file download is now built separately
      # from the onedir tree the packages below embed (assets/dist/zotero-cli
      # is a directory, not a file - it's already inside the .tar.gz/.zip/
      # .deb/.rpm/.msi and isn't published again on its own).
      - name: Collect release files and checksums
        run: |
          mkdir release
          cp assets/dist-onefile/zotero-cli assets/dist-onefile/zotero-cli.exe \
            assets/*.tar.gz assets/*.deb assets/*.rpm assets/*.zip assets/*.msi \
            assets/THIRD_PARTY_LICENSES-*.txt release/
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Signed SLSA build provenance: `gh attestation verify <file> -R
      # fchicout/zotero-cli` proves a file was built by this workflow from
      # this repository.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release/*'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src-checkout

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The notes are the version's CHANGELOG section plus how to verify
          # the files (Issue #416), not only the PR titles.
          python3 src-checkout/scripts/release_notes.py "$TAG" \
            --changelog src-checkout/CHANGELOG.md > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --verify-tag --notes-file notes.md
          fi

  # The sdist and wheel are built and smoke-tested with the binaries, on PRs
  # too, so a broken package fails before anything is published (Issue #416).
  build-python:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv venv --python 3.14 /tmp/wheel-venv
          VIRTUAL_ENV=/tmp/wheel-venv uv pip install dist/*.whl
          /tmp/wheel-venv/bin/zotero-cli --help
          /tmp/wheel-venv/bin/zotero-cli system selftest
          /tmp/wheel-venv/bin/python scripts/smoke_imports.py

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    # First to publish (Issue #416): the GitHub release waits for it. Kept
    # apart from the build jobs: it gets a read-only GITHUB_TOKEN and no
    # cached state. PyPI Trusted Publishing (Issue #421): PyPI accepts a
    # short-lived OIDC token for this repository, this workflow and the
    # `pypi` environment (restricted to v* tags) - no stored API token.
    if: github.event_name == 'push'
    needs: [build-linux, build-windows, build-python, check-glibc-floor]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zotero-command-line/
    permissions:
      contents: read
      id-token: write  # the OIDC token PyPI Trusted Publishing checks
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist

      # --check-url skips files PyPI already has, so a rerun after a partial
      # upload finishes instead of failing on "file exists".
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
