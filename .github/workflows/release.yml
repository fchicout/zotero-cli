name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions: 
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install exactly what uv.lock pins (Issue #333): an unlocked
          # `uv pip install .` resolved bibtexparser 2.x, a breaking rewrite.
          uv sync --locked --no-editable
          uv pip install pyinstaller
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build Binary with PyInstaller
        run: |
          pyinstaller --onefile --name zotero-cli \
            --add-data "src/zotero_cli/templates/extraction_schema.yaml:zotero_cli/templates" \
            --add-data "src/zotero_cli/templates/demo_sandbox.yaml:zotero_cli/templates" \
            --exclude-module torch \
            --exclude-module nvidia \
            --exclude-module mkl \
            --exclude-module numpy \
            --exclude-module pandas \
            --exclude-module matplotlib \
            --clean src/zotero_cli/cli/main.py

      # Never publish a binary that can't start (Issue #333).
      - name: Smoke test binary
        run: ./dist/zotero-cli --help

      - name: Install FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Get Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Tarball
        run: |
          tar -czvf zotero-cli-linux-amd64.tar.gz -C dist zotero-cli

      - name: Create DEB Package
        run: |
          mkdir -p dist/deb/usr/bin
          cp dist/zotero-cli dist/deb/usr/bin/
          fpm -s dir -t deb -n zotero-cli -v ${{ steps.get_version.outputs.VERSION }} \
            --prefix / \
            -C dist/deb \
            --description "Command-line interface for managing Zotero libraries" \
            --maintainer "Fabio Chicout <fchicout@gmail.com>" \
            --url "https://github.com/fchicout/zotero-cli" \
            usr/bin/zotero-cli
          mv zotero-cli_*.deb zotero-cli-linux-amd64.deb

      - name: Create RPM Package
        run: |
          fpm -s dir -t rpm -n zotero-cli -v ${{ steps.get_version.outputs.VERSION }} \
            --prefix / \
            -C dist/deb \
            --description "Command-line interface for managing Zotero libraries" \
            --maintainer "Fabio Chicout <fchicout@gmail.com>" \
            --url "https://github.com/fchicout/zotero-cli" \
            usr/bin/zotero-cli
          mv zotero-cli-*.rpm zotero-cli-linux-amd64.rpm

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/zotero-cli
            zotero-cli-linux-amd64.tar.gz
            zotero-cli-linux-amd64.deb
            zotero-cli-linux-amd64.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install exactly what uv.lock pins (Issue #333): an unlocked
          # `uv pip install .` resolved bibtexparser 2.x, a breaking rewrite.
          uv sync --locked --no-editable
          uv pip install pyinstaller
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.venv\Scripts"

      - name: Build Binary with PyInstaller
        run: |
          pyinstaller --onefile --name zotero-cli `
            --add-data "src/zotero_cli/templates/extraction_schema.yaml;zotero_cli/templates" `
            --add-data "src/zotero_cli/templates/demo_sandbox.yaml;zotero_cli/templates" `
            --exclude-module torch `
            --exclude-module nvidia `
            --exclude-module mkl `
            --exclude-module numpy `
            --exclude-module pandas `
            --exclude-module matplotlib `
            --clean src/zotero_cli/cli/main.py

      - name: Smoke test binary
        run: ./dist/zotero-cli.exe --help

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $numericVersion = $version -replace '-.*$', ''
          if ($numericVersion -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            $numericVersion = "0.0.0"
          }
          echo "VERSION=$numericVersion" >> $env:GITHUB_OUTPUT

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 4.0.1

      - name: Build MSI Installer
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}".Split("-")[0]
          wix build -d Version=$ver scripts/windows/installer.wxs -o zotero-cli-windows-amd64.msi

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/zotero-cli.exe -DestinationPath zotero-cli-windows-amd64.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/zotero-cli.exe
            zotero-cli-windows-amd64.zip
            zotero-cli-windows-amd64.msi

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: assets

      - name: List assets
        run: ls -R assets

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            assets/dist/zotero-cli
            assets/*.tar.gz
            assets/*.deb
            assets/*.rpm
            assets/dist/zotero-cli.exe
            assets/*.zip
            assets/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    # Runs only after the binaries built and the GitHub release was created,
    # so a broken build never reaches PyPI. Kept apart from the jobs above:
    # it gets a read-only GITHUB_TOKEN, no cached state, and the PyPI token
    # only through the `pypi` environment (restricted to v* tags).
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zotero-command-line/
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.11'
          enable-cache: false

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv venv --python 3.11 /tmp/wheel-venv
          VIRTUAL_ENV=/tmp/wheel-venv uv pip install dist/*.whl
          /tmp/wheel-venv/bin/zotero-cli --help
          /tmp/wheel-venv/bin/python scripts/smoke_imports.py

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
