name: Run Unit Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.11'
          enable-cache: true

      # Runtime-only install from the lock first, before any dev extras: a
      # module-level import of a dev-only or optional dependency passes the
      # rest of this job but crashes for users (Issue #333).
      - name: Install runtime dependencies only
        run: uv sync --locked

      - name: Smoke test runtime-only install
        run: |
          uv run --no-sync zotero-cli --help
          uv run --no-sync python scripts/smoke_imports.py

      # Issue #335: fail on known vulnerabilities in what users install;
      # report (without failing) those in optional extras and dev tools.
      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --no-header --no-annotate \
            -o "$RUNNER_TEMP/requirements-runtime.txt"
          # Up to 3 attempts: a PyPI/OSV timeout shouldn't fail the build,
          # but a real finding fails every attempt.
          for attempt in 1 2 3; do
            uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements-runtime.txt" \
              --no-deps --disable-pip --progress-spinner off --timeout 60 && exit 0
            echo "pip-audit attempt $attempt failed"; sleep 10
          done
          exit 1

      - name: Audit optional and dev dependencies (informational)
        continue-on-error: true
        run: |
          uv export --locked --all-extras --all-groups --no-hashes --no-emit-project --no-header \
            --no-annotate -o "$RUNNER_TEMP/requirements-all.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements-all.txt" \
            --no-deps --disable-pip --progress-spinner off --timeout 60

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type Check with Mypy
        run: uv run mypy .

      - name: Run Tests
        env:
          PYTHONPATH: src
        run: |
          uv run pytest tests/unit --cov=src/zotero_cli --cov-report=xml

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Debug SonarQube Quality Gate Failure
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          uv run python scratch/debug_sonar_gate.py
