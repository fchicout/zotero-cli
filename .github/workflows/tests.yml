name: Run Unit Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Actions secrets aren't available to Dependabot PRs (nor to forks), so
      # the SonarQube steps are skipped there instead of failing the job.
      HAS_SONAR: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # The version releases are built with (.python-version).
          python-version: '3.14'
          enable-cache: true

      # Runtime-only install from the lock first, before any dev extras: a
      # module-level import of a dev-only or optional dependency passes the
      # rest of this job but crashes for users (Issue #333).
      - name: Install runtime dependencies only
        run: uv sync --locked

      - name: Smoke test runtime-only install
        run: |
          uv run --no-sync zotero-cli --help
          uv run --no-sync python scripts/smoke_imports.py

      # Issue #335: fail on known vulnerabilities in what users install;
      # report (without failing) those in optional extras and dev tools.
      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --no-header --no-annotate \
            -o "$RUNNER_TEMP/requirements-runtime.txt"
          # Up to 3 attempts: a PyPI/OSV timeout shouldn't fail the build,
          # but a real finding fails every attempt.
          for attempt in 1 2 3; do
            uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements-runtime.txt" \
              --no-deps --disable-pip --progress-spinner off --timeout 60 && exit 0
            echo "pip-audit attempt $attempt failed"; sleep 10
          done
          exit 1

      - name: Audit optional and dev dependencies (informational)
        continue-on-error: true
        run: |
          uv export --locked --all-extras --all-groups --no-hashes --no-emit-project --no-header \
            --no-annotate -o "$RUNNER_TEMP/requirements-all.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements-all.txt" \
            --no-deps --disable-pip --progress-spinner off --timeout 60

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type Check with Mypy
        run: uv run mypy .

      - name: Run Tests
        env:
          PYTHONPATH: src
        run: |
          uv run pytest tests/unit --cov=src/zotero_cli --cov-report=xml

      # Every documented example must parse, and the docs must match the CLI
      # (Issue #386). No network, no config.
      - name: Run docs tests
        run: uv run pytest tests/docs -q

      - name: SonarQube skipped (no Sonar secrets in this context)
        if: env.HAS_SONAR != 'true'
        run: echo "::notice::SonarQube analysis skipped - SONAR_TOKEN/SONAR_HOST_URL aren't available to this run (e.g. a Dependabot PR)."

      - name: SonarQube Scan
        if: env.HAS_SONAR == 'true'
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        if: env.HAS_SONAR == 'true'
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Debug SonarQube Quality Gate Failure
        if: failure() && env.HAS_SONAR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          uv run python scratch/debug_sonar_gate.py

  # Issue #404: the Python package must install from pre-built wheels on
  # every platform the README lists as supported, so a new dependency that
  # only ships wheels for some platforms (or needs a compiler) fails here
  # instead of on users' machines. bibtexparser 1.x is pure Python but ships
  # only an sdist, so it is exempt. Resolution only - nothing is installed.
  platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Resolve wheels for each supported platform
        run: |
          set -u
          failed=0
          check() {  # platform python-version
            if uv pip compile pyproject.toml --python-platform "$1" --python-version "$2" \
                 --only-binary :all: --no-binary bibtexparser --quiet \
                 -o "$RUNNER_TEMP/req-$1-$2.txt"; then
              echo "ok      $1 / Python $2"
            else
              echo "FAILED  $1 / Python $2"; failed=1
            fi
          }
          for py in 3.11 3.14; do
            for platform in x86_64-apple-darwin aarch64-apple-darwin \
                x86_64-unknown-linux-musl x86_64-pc-windows-msvc \
                x86_64-manylinux_2_28 aarch64-manylinux_2_28; do
              check "$platform" "$py"
            done
          done
          # Older glibc (e.g. RHEL/CentOS 7-8): Python 3.11-3.13.
          for py in 3.11 3.13; do
            check x86_64-manylinux_2_17 "$py"
            check aarch64-manylinux_2_17 "$py"
          done
          exit "$failed"

  # The oldest version requires-python still accepts: PyPI users may be on it.
  # A separate job (not a matrix) so the required `test` check keeps its name.
  test-min-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Smoke test runtime-only install
        run: |
          uv sync --locked
          uv run --no-sync zotero-cli --help
          uv run --no-sync python scripts/smoke_imports.py

      - name: Type check against 3.11
        run: |
          uv sync --locked --extra dev
          uv run mypy . --python-version 3.11

      - name: Run unit tests
        run: uv run pytest tests/unit -q
