name: Run Unit Tests

# Companion to tests.yml's `paths-ignore` (Issue #274): that workflow
# skips entirely for a PR whose diff is only `.md`/`docs/**` files, so the
# `test` job never posts a status for such a PR. If branch protection marks
# that job a required status check, a docs-only PR could never satisfy it
# and would be permanently BLOCKED (confirmed hands-on via PR #309, Issue
# #310) - GitHub never resolves a required check that no workflow run ever
# posts a status for.
#
# This workflow uses the exact inverse path filter and the same job name
# ("test") as tests.yml, so between the two, every PR gets a "test" status
# posted by exactly one of them - or, for a PR touching both code and docs,
# by both (a documented, harmless outcome of this pattern: multiple check
# runs sharing a name is fine, branch protection just needs one to
# succeed). For a docs-only change it runs the docs tests, which check that
# every documented example parses with the real CLI and that the docs match
# the command tree (Issue #386) - they need no network, config or dev extras.
on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install runtime dependencies
        run: uv sync --locked

      - name: Run docs tests
        run: uv run --no-sync --with pytest pytest tests/docs -q
