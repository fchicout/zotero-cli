[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Published on PyPI as `zotero-command-line`: the `zotero-cli` name there
# belongs to an unrelated, inactive 2016 project, and PyPI rejects names
# that differ from it only by separators (e.g. `zoterocli`). The command
# stays `zotero-cli` and the import package stays `zotero_cli`.
name = "zotero-command-line"
version = "2.8.11"
description = "Manage your Zotero library from the command line: scripting, automation and LLM-assisted workflows."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Fábio Chicout"}]
keywords = ["zotero", "cli", "bibliography", "reference-management", "research", "automation", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.33.0",
    "rich>=13.7.0",
    "toml>=0.10.2",
    "tenacity>=8.2.3",
    "arxiv>=2.1.0",
    "bibtexparser>=1.4.0,<2",
    "rispy>=0.4.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "rapidfuzz>=3.6.1",
    "PyYAML>=6.0.1",
    "beautifulsoup4>=4.12.0",
    "networkx>=3.0",
    # markitdown (and its onnxruntime dependency, for magika file-type
    # detection) is not RAG-only: item/collection export --format md
    # (attachment_service.py::get_fulltext) uses it too, so it stays here
    # rather than in the [rag] extra below (Issue #180).
    "markitdown>=0.1.5",
    "onnxruntime>=1.24.2",
    "pygments>=2.20.0",
    "filelock>=3.30.3",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/fchicout/zotero-cli"
Documentation = "https://github.com/fchicout/zotero-cli/tree/main/docs"
Issues = "https://github.com/fchicout/zotero-cli/issues"
Changelog = "https://github.com/fchicout/zotero-cli/blob/main/CHANGELOG.md"

[project.scripts]
zotero-cli = "zotero_cli.cli.main:main"

[project.optional-dependencies]
# RAG/semantic-search stack (Issue #180): every import of these packages in
# src/ is already lazy (function-local, not module-level - verified by
# reading the code, not assumed), so a consumer that never calls `rag ...`
# or configures a local/HF-backed provider never pays for them. A
# lite-install user who does hit one gets a clear ImportError, not a crash
# elsewhere. openai/google-generativeai are here too since LLMProvider/
# EmbeddingProvider (embedding_provider.py, llm_provider.py) are only
# constructed by the RAG subsystem (AIProviderFactory.get_rag_service and
# `system check`'s diagnostics, which degrades to a FAILED check row rather
# than crashing if this extra isn't installed).
rag = [
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "einops>=0.7.0",
    "torch>=2.0.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "accelerate>=0.26.0",
]
dev = [
    "zotero-command-line[rag]",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests",
    "types-toml",
    "bandit>=1.7.5",
    "pre-commit>=3.6.0",
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), isort (I)
select = ["F", "E", "W", "I"]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["zotero_cli"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["build/", "scratch/", "scripts/"]

# tests/ stays lenient for now (Issue #132): src/ is fully strict-typed as
# of this change, but annotating ~1050 pre-existing test-function
# signatures is a separate, larger follow-up left for later.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning",
]
markers = [
    "unit: fast isolated logic tests",
    "e2e: tests that interact with real APIs or external state",
    "docs: tests for documentation consistency and repository structure",
]

[tool.coverage.run]
relative_files = true
source = ["src"]

[dependency-groups]
release = [
    "pyinstaller>=6.22",
]


