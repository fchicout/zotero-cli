# SonarQube Project Configuration
# This file configures the SonarScanner for the zotero-cli project.

# Unique project key and name in SonarQube
sonar.projectKey=zotero-cli
sonar.projectName=zotero-cli
sonar.projectVersion=2.8.0

# Paths to the source directories
sonar.sources=src
sonar.tests=tests

# Exclusions and Inclusions
# We exclude dependencies, cache folders, and unit tests from source analysis
sonar.exclusions=**/__pycache__/**, **/.venv/**, **/tests/**
sonar.test.inclusions=tests/**/*.py

# Language & Environment settings
sonar.language=py
sonar.python.version=3.11

# Code Coverage Integration
# Specifies the path to the coverage report generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Exclude CLI/TUI presentation layers (I/O-driven, exercised via CLI-dispatch
# tests rather than unit-level branch coverage) and interfaces.py (Protocols
# only, no logic) from coverage calculations. collection_service.py,
# sdb/sdb_service.py, and rag_service.py were previously excluded here too
# under a "legacy core services" rationale that didn't hold - per CLAUDE.md's
# own architecture description, these are the SLR audit-trail, collection
# management, and RAG domain logic, not legacy or presentational (Issue
# #294). Removed from this list now that sdb_service.py's previously-
# uncovered filter_items_by_sdb branches have direct unit test coverage.
sonar.coverage.exclusions=src/zotero_cli/cli/**/*.py, src/zotero_cli/cli/tui/**/*.py, src/zotero_cli/core/interfaces.py

# Ignore Cognitive Complexity globally
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*


